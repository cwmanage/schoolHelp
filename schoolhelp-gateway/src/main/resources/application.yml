server:
  port: 8080

spring:
  application:
    name: schoolhelp-gateway
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: "ENC(R55G49wCZNObiU3/OK1iBlY3uHDOcd49p5FznRcblitq53B1trQ87N3uQn9LfCgl)"
    gateway:
      routes:
        # 用户服务
        - id: user-service
          uri: lb://schoolhelp-user
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=2
        # 课程服务
        - id: course-service
          uri: lb://schoolhelp-course
          predicates:
            - Path=/api/course/**
          filters:
            - StripPrefix=2
        # 业务服务
        - id: biz-service
          uri: lb://schoolhelp-biz
          predicates:
            - Path=/api/biz/**
          filters:
            - StripPrefix=2

# 白名单路径（无需登录）：登录/注册/密码强度提示等
schoolhelp:
  auth:
    whitelist:
      - /api/user/auth/login
      - /api/user/auth/register
      - /api/user/auth/password-strength
      - /api/user/auth/check-username

logging:
  level:
    org.springframework.cloud.gateway: info

# ===== 配置加密（Jasypt）=====
# Nacos 等敏感字段以 ENC(密文) 形式存储；解密口令通过环境变量注入，不落盘、不进仓库。
# 本地运行：先设置环境变量 JASYPT_ENCRYPTOR_PASSWORD（start-all.ps1 会自动从 .env.local 加载）。
jasypt:
  encryptor:
    password: ${JASYPT_ENCRYPTOR_PASSWORD}
    algorithm: PBEWITHHMACSHA512ANDAES_256
    key-obtention-iterations: 1000
    pool-size: 1
    salt-generator-classname: org.jasypt.salt.RandomSaltGenerator
    iv-generator-classname: org.jasypt.iv.RandomIvGenerator
    string-output-type: base64
