  # AI 问答（免费大模型 OpenAI 兼容接口，默认智谱 GLM-4-Flash；API Key 未配置时功能不可用）
  # API Key 以 Jasypt ENC 加密存储（仓库公开，不落明文），口令经环境变量 JASYPT_ENCRYPTOR_PASSWORD 注入
  ai:
    base-url: ${SCHOOLHELP_AI_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
    api-key: "ENC(MRUpNLGj8M0hG5a8Zc47Xqv20uCGgaW2uTHdWJ1l8sChaPfVKdPnKdCnJmxqgX26JUlbarsW72MIUwlOsOfqzvyvuv0lDmPoL4ecD8f3WFl80SVsm+S+4vKB3mrVcNFB)"
    model: ${SCHOOLHELP_AI_MODEL:glm-4-flash}

    # Agent 系统提示词（比赛调优改这里免发版；%s 占位：日期、星期）
    agent-system-prompt: ""
    # 试用 Key（新账号资源包；明文经环境变量注入，不落仓库）
    trial-api-key: ${SCHOOLHELP_TRIAL_API_KEY:}
    # 模型档案池（ModelProfile）：全部端点的能力卡片（窗口/档位/思考分级/模态/有效期）
    # 编排策略：工具决策轮=LITE 档 / 最终回答轮=FLAGSHIP 档（orchestrator 可调）
    # 端点顺序 = 降级链顺序：4.7-flash×2(免费最强) → 5.3资源包×2(高峰顶上) → 4.5/4-flash×2(低档兜底)
    # 模型档案池（端点顺序 = 降级链顺序）
    # 资源包优先（2026-12-03 到期，先过期先用：main/trial 各赠 2000万 5.3-flash + trial 新用户包），
    # 到期自动踢出回落免费池（免费模型永续，兜底）
    profiles:
      - id: main-5.3-flash
        key-ref: main
        model: glm-5.3-flash
        context-tokens: 200000
        tier: FLAGSHIP
        thinking: optional
        tools: true
        expire-at: 2026-12-03
      - id: trial-5.3-flash
        key-ref: trial
        model: glm-5.3-flash
        context-tokens: 200000
        tier: FLAGSHIP
        thinking: optional
        tools: true
        expire-at: 2026-12-03
      - id: trial-5.3-flashx
        key-ref: trial
        model: glm-5.3-flashx
        context-tokens: 200000
        tier: FLAGSHIP
        thinking: optional
        tools: true
        expire-at: 2026-12-03
      - id: main-4.7-flash
        key-ref: main
        model: glm-4.7-flash
        context-tokens: 200000
        tier: LITE
        thinking: optional
        tools: true
      - id: trial-4.7-flash
        key-ref: trial
        model: glm-4.7-flash
        context-tokens: 200000
        tier: LITE
        thinking: optional
        tools: true
      - id: main-4.5-flash
        key-ref: main
        model: glm-4.5-flash
        context-tokens: 128000
        tier: LITE
        thinking: none
        tools: true
      - id: trial-4.5-flash
        key-ref: trial
        model: glm-4.5-flash
        context-tokens: 128000
        tier: LITE
        thinking: none
        tools: true
      - id: main-4-flash
        key-ref: main
        model: glm-4-flash
        context-tokens: 128000
        tier: LITE
        thinking: none
        tools: true
      - id: trial-4-flash
        key-ref: trial
        model: glm-4-flash
        context-tokens: 128000
        tier: LITE
        thinking: none
        tools: true
      # 视觉端点（免费 4.6V 双 Key；视觉资源包已过期）
      - id: main-4.6v-flash
        key-ref: main
        model: glm-4.6v-flash
        context-tokens: 128000
        tier: VISION
        thinking: none
        tools: false
        vision: true
      - id: trial-4.6v-flash
        key-ref: trial
        model: glm-4.6v-flash
        context-tokens: 128000
        tier: VISION
        thinking: none
        tools: false
        vision: true
    orchestrator:
      # 决策+回答统一走完整降级链 agentChain()：FLAGSHIP 端点在前(4.7-flash×2免费→5.3资源包×2)，
      # LITE 端点在后(4.5/4-flash×2 低档兜底)——免费优先、能力降序、全池覆盖
      tool-decision-tier: FLAGSHIP
      final-answer-tier: FLAGSHIP
      polish-with-flagship: false

# ===== 配置加密（Jasypt）=====
# 数据库/Nacos 等敏感字段以 ENC(密文) 形式存储；解密口令通过环境变量注入，不落盘、不进仓库。
# 本地运行：先设置环境变量 JASYPT_ENCRYPTOR_PASSWORD（start-all.ps1 会自动从 .env.local 加载）。
jasypt:
  encryptor:
    password: ${JASYPT_ENCRYPTOR_PASSWORD}
    algorithm: PBEWITHHMACSHA512ANDAES_256
    key-obtention-iterations: 1000
    pool-size: 1
    salt-generator-classname: org.jasypt.salt.RandomSaltGenerator
    iv-generator-classname: org.jasypt.iv.RandomIvGenerator
    string-output-type: base64
