# 文件上传目录（开发期本地；部署改 NAS /mnt/nas/uploads）
schoolhelp:
  file:
    upload-dir: ${SCHOOLHELP_UPLOAD_DIR:D:/homework/schoolHelp/schoolHelp/schoolhelp-user/uploads}
    base-url: /files
  # AI 问答（免费大模型 OpenAI 兼容接口，默认智谱 GLM-4-Flash；API Key 未配置时功能不可用）
  # API Key 以 Jasypt ENC 加密存储（仓库公开，不落明文），口令经环境变量 JASYPT_ENCRYPTOR_PASSWORD 注入
  ai:
    base-url: ${SCHOOLHELP_AI_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
    api-key: "ENC(MRUpNLGj8M0hG5a8Zc47Xqv20uCGgaW2uTHdWJ1l8sChaPfVKdPnKdCnJmxqgX26JUlbarsW72MIUwlOsOfqzvyvuv0lDmPoL4ecD8f3WFl80SVsm+S+4vKB3mrVcNFB)"
    model: ${SCHOOLHELP_AI_MODEL:glm-4-flash}
    vision-model: ${SCHOOLHELP_AI_VISION_MODEL:glm-4.6v-flash}
    # 视觉降级链：3 个免费视觉模型 × 2 Key = 6 端点（4.6V 强 → 4.1V-Thinking → 4V 兜底；跨 Key 并发扩容）
    vision-fallback-models:
      - key-ref: trial
        model: glm-4.6v-flash
      - key-ref: main
        model: glm-4.1v-thinking-flash
      - key-ref: trial
        model: glm-4.1v-thinking-flash
      - key-ref: main
        model: glm-4v-flash
      - key-ref: trial
        model: glm-4v-flash
    # Agent 专用模型（工具调用能力更强；与普通问答分模型限速池，互不占用智谱并发配额）
    agent-model: ${SCHOOLHELP_AI_AGENT_MODEL:glm-4.7-flash}
    # Agent 降级链：主 Key 免费模型池(4.7-flash→4.5-flash→4-flash) → 试用 Key 资源包模型
    # key-ref: main=主 Key（免费模型）/ trial=试用 Key（新账号资源包，2027-02-03 到期，自动踢出）
    trial-api-key: ${SCHOOLHELP_TRIAL_API_KEY:}
    # 免费模型跨 Key 扩容：同模型相邻排列（主 Key 失败立即用 trial Key 同模型，能力无损）
    agent-fallback-models:
      - key-ref: trial
        model: glm-4.7-flash
      - key-ref: main
        model: glm-4.5-flash
      - key-ref: trial
        model: glm-4.5-flash
      - key-ref: main
        model: glm-4-flash
      - key-ref: trial
        model: glm-4-flash
      - key-ref: trial
        model: glm-5.3-flash
        expire-at: 2027-02-03
      - key-ref: trial
        model: glm-5.3-flashx
        expire-at: 2027-02-03

# ===== 配置加密（Jasypt）=====
# 数据库/Nacos 等敏感字段以 ENC(密文) 形式存储；解密口令通过环境变量注入，不落盘、不进仓库。
# 本地运行：先设置环境变量 JASYPT_ENCRYPTOR_PASSWORD（start-all.ps1 会自动从 .env.local 加载）。
jasypt:
  encryptor:
    password: ${JASYPT_ENCRYPTOR_PASSWORD}
    algorithm: PBEWITHHMACSHA512ANDAES_256
    key-obtention-iterations: 1000
    pool-size: 1
    salt-generator-classname: org.jasypt.salt.RandomSaltGenerator
    iv-generator-classname: org.jasypt.iv.RandomIvGenerator
    string-output-type: base64
