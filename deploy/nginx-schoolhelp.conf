# ============================================================
# schoolHelp Nginx 站点配置（宝塔：放到 /www/server/panel/vhost/nginx/schoolhelp.conf）
# 或标准 Nginx：/etc/nginx/conf.d/schoolhelp.conf
# 职责：托管两端前端静态站 + 把 /api 反代到网关 8080
#   PC 端  -> 80 端口（主入口）
#   移动端 -> 8081 端口
# ============================================================

# ---------- PC 端（80） ----------
server {
    listen 80;
    server_name _;              # 有域名就换成 cwproject.xyz
    root /var/www/schoolhelp/pc;
    index index.html;

    # 前端路由（history 模式）：找不到文件回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # 接口反代到网关（末尾不带斜杠，保留 /api 前缀）
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 上传文件大小（头像/课件）
    client_max_body_size 20m;
}

# ---------- 移动端（8081） ----------
server {
    listen 8081;
    server_name _;
    root /var/www/schoolhelp/m;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    client_max_body_size 20m;
}
