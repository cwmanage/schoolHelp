# schoolHelp 站点 · 全 HTTPS（Let's Encrypt 证书，certbot 自动续期）
# 架构：cwproject.xyz/www → PC 站（:443）；m.cwproject.xyz → 移动站（:443）
# 注意：8081 旧端口已废弃（安全组未放行），移动端统一走 m 子域 HTTPS
# ⚠️ 坑1：proxy_pass 不能带尾斜杠（/api 前缀必须留给 gateway StripPrefix=2 剥）
# ⚠️ 坑2：禁止设置 Connection: upgrade（无 WebSocket 需求，Reactor Netty 会 404）

# IP 直连跳主域（避免证书域名不匹配）
map $http_host $jump_host {
    ~^[0-9.]+(:[0-9]+)?$  cwproject.xyz;
    default              $http_host;
}

# HTTP → HTTPS（308 保留请求方法与 body，POST 登录等不退化）
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 308 https://$jump_host$request_uri;
}

# PC 站（HTTPS）
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name cwproject.xyz www.cwproject.xyz 62.234.29.217 _;
    root /var/www/schoolhelp/pc;
    index index.html;
    access_log /var/log/nginx/schoolhelp-pc-access.log;
    error_log /var/log/nginx/schoolhelp-pc-error.log;

    ssl_certificate     /etc/letsencrypt/live/cwproject.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cwproject.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ACME 证书续期验证（certbot webroot）
    location /.well-known/acme-challenge/ {
        root /var/www/schoolhelp/pc;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 205m;
    }
}

