# schoolHelp 站点 · 全 HTTPS + 同域 UA 设备分流
# 架构：https://cwproject.xyz（含 www）——手机访问自动返回移动端页面（nginx 按 User-Agent 分流，同一 URL 无跳转）
# 设备切换参数：?pc=1 强制电脑版，?mobile=1 强制手机版
# ⚠️ 坑1：proxy_pass 不能带尾斜杠（/api 前缀必须留给 gateway StripPrefix=2 剥）
# ⚠️ 坑2：禁止设置 Connection: upgrade（无 WebSocket 需求，Reactor Netty 会 404）

# UA → 站点根目录（手机/平板走移动端 dist，其余走 PC dist）
map $http_user_agent $sh_root {
    ~*Android|iPhone|iPad|iPod|Windows\s*Phone|HarmonyOS|BlackBerry|IEMobile|Opera\s*Mini|Mobile|MicroMessenger   /var/www/schoolhelp/m;
    default   /var/www/schoolhelp/pc;
}

# ?pc=1 / ?mobile=1 强制切换（查询参数优先于 UA）
map $arg_pc $force_pc {
    1  /var/www/schoolhelp/pc;
    default  "";
}
map $arg_mobile $force_m {
    1  /var/www/schoolhelp/m;
    default  "";
}
map "$force_pc$force_m$sh_root" $site_root {
    ~^/var/www/schoolhelp/pc  /var/www/schoolhelp/pc;
    ~^/var/www/schoolhelp/m   /var/www/schoolhelp/m;
    default                   $sh_root;
}

# HTTP → HTTPS（308 保留请求方法与 body，POST 登录等不退化）
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 308 https://$jump_host$request_uri;
}

# 站点（HTTPS，同域分流）
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name cwproject.xyz www.cwproject.xyz 62.234.29.217 _;
    root $site_root;
    index index.html;
    access_log /var/log/nginx/schoolhelp-access.log;
    error_log /var/log/nginx/schoolhelp-error.log;

    ssl_certificate     /etc/letsencrypt/live/cwproject.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cwproject.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ACME 证书续期验证（certbot webroot 固定走 PC webroot）
    location /.well-known/acme-challenge/ {
        root /var/www/schoolhelp/pc;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 205m;
    }
}
